[build-system]
requires = ["flit_core >= 3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "example"
authors = [
    {name = "Yasha", email = "yasuhiro.asaka@grauwoelfchen.net"},
]
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [ # runtime deps
    "typer>=0.15.1",
]

[project.urls]
home = "http://codeberg.org/grauwoelfchen/example"

[project.scripts]
example = "example:app"

[dependency-groups] # development deps
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.6",
]
test = [
    "coverage>=7.6.12",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]

[tool.uv]
default-groups = ["dev", "test"]
